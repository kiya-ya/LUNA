name: exam-system

services:
  exam:
    build: .
    ports:
      - "5000:5000"
    volumes:
      # 持久化 SQLite 数据库（防止容器重启数据丢失）
      - ./data.db:/app/data.db
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      # AI 阅卷/生题 API Key（硅基流动）
      # 请替换为你的真实 API Key，或在宿主机设置环境变量后引用：
      # - SILICONFLOW_API_KEY=${SILICONFLOW_API_KEY}

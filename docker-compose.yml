name: exam-system

services:
  exam:
    build: .
    image: exam-system:v1.6.1
    container_name: luna-exam
    ports:
      - "5001:5000"
    volumes:
      - ./data.db:/app/data.db
      - ./uploads:/app/uploads
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - SILICONFLOW_API_KEY=${SILICONFLOW_API_KEY:-}
      - PYTHON_PATH=/usr/bin/python3